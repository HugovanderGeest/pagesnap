name: iOS TestFlight Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - Website

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: pagesnap_flutter
        run: flutter pub get

      - name: Configure App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" ]; then
            echo "::error::APP_STORE_CONNECT_KEY_ID or APP_STORE_CONNECT_PRIVATE_KEY_BASE64 secret is missing or empty!"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys/
          printf "%s" "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Install dependencies in iOS directory
        working-directory: pagesnap_flutter/ios
        run: sudo gem install fastlane -n /usr/local/bin

      - name: Debug Fastlane environment
        working-directory: pagesnap_flutter/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          echo "Listing App Store Connect key file:"
          ls -la ~/.appstoreconnect/private_keys || true
          echo "Checking API Key file size (should be ~150-170 bytes):"
          ls -l ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 || true
          echo "Relevant env vars:"
          env | egrep 'APP_STORE|KEYCHAIN|MATCH|SIGH' || true
          fastlane --version || true
          echo "Ruby version:"
          ruby -v || true
          echo "Relevant env vars:"
          env | egrep 'APP_STORE|KEYCHAIN|MATCH|SIGH' || true

      - name: Run Fastlane Beta (capture logs)
        working-directory: pagesnap_flutter/ios
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGH_PROFILE_ID: ${{ secrets.SIGH_PROFILE_ID }}
          MATCH_GIT_URL: "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          MATCH_GIT_BRANCH: "match_keys"
          MATCH_PASSWORD: "default_pagesnap_match_password_123!"
          MATCH_READONLY: false
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          set -o pipefail
          fastlane beta 2>&1 | tee fastlane.log

      - name: Upload Fastlane logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs-${{ github.run_id }}
          path: pagesnap_flutter/ios/fastlane.log
