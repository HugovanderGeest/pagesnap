name: iOS TestFlight Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - Website

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: pagesnap_flutter
        run: flutter pub get

      - name: Configure App Store Connect API Key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_CONTENT_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          printf "%s" "$APP_STORE_CONNECT_KEY_CONTENT_BASE64" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Install dependencies in iOS directory
        working-directory: pagesnap_flutter/ios
        run: sudo gem install fastlane -n /usr/local/bin

      - name: Debug Fastlane environment
        working-directory: pagesnap_flutter/ios
        run: |
          echo "Listing App Store Connect key file:"
          ls -la ~/.appstoreconnect/private_keys || true
          echo "Checking API Key file size (should be ~150-170 bytes):"
          ls -l ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 || true
          echo "Relevant env vars:"
          env | egrep 'APP_STORE|KEYCHAIN|MATCH|SIGH' || true
          fastlane --version || true
          echo "Ruby version:"
          ruby -v || true
          echo "Relevant env vars:"
          env | egrep 'APP_STORE|KEYCHAIN|MATCH|SIGH' || true

      - name: Run Fastlane Beta (capture logs)
        working-directory: pagesnap_flutter/ios
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_CONTENT_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGH_PROFILE_ID: ${{ secrets.SIGH_PROFILE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: ${{ secrets.MATCH_READONLY }}
        run: |
          set -o pipefail
          fastlane beta 2>&1 | tee fastlane.log

      - name: Upload Fastlane logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs-${{ github.run_id }}
          path: pagesnap_flutter/ios/fastlane.log
