<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Peruse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Peruse</title>
  <link rel="manifest" href="manifest.json">

  <!-- Tesseract.js — in-browser OCR, no API key needed -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    // Wrapper Dart calls into – returns a Promise resolving to the OCR text string
    window._runOcr = async function(blobUrl) {
      try {
        const { data } = await Tesseract.recognize(blobUrl, 'eng', { logger: () => {} });
        return data.text || '';
      } catch (e) {
        return '';
      }
    };

    // Fullscreen helpers called from the reader screen
    window._enterFullscreen = function() {
      var el = document.documentElement;
      var p;
      if (el.requestFullscreen) p = el.requestFullscreen();
      else if (el.webkitRequestFullscreen) p = Promise.resolve(el.webkitRequestFullscreen());
      if (p) p.catch(function(){});
      // Also lock orientation to landscape for Android immersive mode
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function(){});
        }
      } catch(e) {}
    };
    window._exitFullscreen = function() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
      try {
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      } catch(e) {}
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
