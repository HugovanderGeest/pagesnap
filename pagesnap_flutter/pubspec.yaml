name: pagesnap_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+15

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  file_picker: ^10.3.10
  shared_preferences: ^2.5.4
  syncfusion_flutter_pdf: ^32.2.7
  lucide_icons: ^0.257.0
  epubx: ^4.0.0
  html: ^0.15.6
  camera: ^0.12.0
  google_mlkit_text_recognition: ^0.15.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  image_cropper: ^12.1.1
  flutter_native_splash: ^2.2.16
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^6.1.6
  intl: ^0.20.2
  crypto: ^3.0.7
  flutter_launcher_icons: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_icons:
  image_path: "assets/icon.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#0F172A"
